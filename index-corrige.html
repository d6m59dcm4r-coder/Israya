<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b5d46">
<meta name="description" content="Israya — La foi, le savoir et le bien qui perdure.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Israya — La foi, le savoir et le bien qui perdure</title>
<style>
:root{--green:#0b5d46;--green2:#11765a;--cream:#fbf8ef;--gold:#c9a75d;--ink:#18342a;--muted:#68776f;--card:#fff;--line:#e3e8e2;--soft:#edf5ef}
:root.dark{--cream:#101815;--ink:#eef5f0;--muted:#aebbb4;--card:#18221e;--line:#2b3933;--soft:#20332b}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}
header{background:linear-gradient(145deg,#073f31,#0b5d46 65%,#11765a);color:white;padding:22px 17px 28px;border-radius:0 0 30px 30px;box-shadow:0 8px 28px #063b2d20}
.top{display:flex;align-items:center;gap:12px}.logo{width:52px;height:52px;flex:0 0 52px}.logo svg{width:100%;height:100%}
h1{font-size:26px;margin:0;letter-spacing:.2px}header p{margin:2px 0 0;color:#e4eee9;font-size:13px}.greeting{margin-top:22px;font-size:22px;font-weight:750;line-height:1.25}.sub{font-size:14px;color:#dceae3;margin-top:7px}
main{max-width:820px;margin:auto;padding:17px 15px 105px}.section-title{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 12px}.section-title h2{font-size:20px;margin:0}.hint{color:var(--muted);font-size:12px}
.daily{background:var(--card);border:1px solid #e8e0ca;border-radius:19px;padding:16px;display:flex;gap:13px;align-items:center}.daily .moon{font-size:28px;background:#f4ecd5;padding:9px 12px;border-radius:14px;color:#6f5b25}.daily p{margin:3px 0 0;font-size:13px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.tile{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:15px;text-align:left;min-height:118px;color:var(--ink);box-shadow:0 2px 10px #18382a08;transition:.15s}.tile:active{transform:scale(.985)}.tile .emoji{font-size:25px;display:block;margin-bottom:8px}.tile strong{display:block;font-size:15px}.tile small{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:19px;padding:17px;margin-top:13px}.panel h2,.panel h3{margin:0 0 10px}.panel p{margin:7px 0}.btn{background:var(--green);color:white;border:0;border-radius:12px;padding:11px 14px;font-weight:700}.btn.secondary{background:var(--soft);color:var(--green);border:1px solid #d1e2d7}.btn.gold{background:#8a6e2d}.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
input,select,textarea{width:100%;padding:12px;border:1px solid #d3ddd6;border-radius:12px;background:var(--card);color:var(--ink);margin:5px 0 11px}label{font-size:13px;font-weight:700}.arabic{font-family:"Noto Naskh Arabic","Amiri",serif;font-size:29px;line-height:1.9;text-align:right;color:var(--green);direction:rtl}.muted{color:var(--muted);font-size:13px}.item{padding:13px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.pill{display:inline-block;background:#f1ead6;color:#735d24;border-radius:30px;padding:4px 9px;font-size:11px;font-weight:750}.progress{height:8px;background:var(--soft);border-radius:10px;overflow:hidden}.progress>i{display:block;height:100%;width:0;background:var(--gold)}
.prayer-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.prayer{padding:13px;border:1px solid var(--line);border-radius:14px;background:var(--soft)}.prayer b{display:block}.prayer time{font-size:20px;font-weight:800}
.notice{padding:11px 12px;border-radius:12px;background:#fff7dc;border:1px solid #ead9a3;color:#66521f;font-size:13px}.dark .notice{background:#302a18;color:#e8d99d}
nav{position:fixed;bottom:0;left:0;right:0;background:#fffffff0;backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 3px calc(8px + env(safe-area-inset-bottom));z-index:10}nav button{border:0;background:none;color:#66756e;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 7px;min-width:62px}nav button span{font-size:20px}nav button.active{color:var(--green);font-weight:800}
footer{text-align:center;color:var(--muted);font-size:11px;padding:25px 10px}.hidden{display:none}
@media(min-width:620px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.prayer-grid{grid-template-columns:repeat(5,1fr)}}
</style>
</head>
<body>
<header>
 <div class="top">
  <div class="logo" aria-label="Logo Israya"><svg viewBox="0 0 64 64" fill="none"><rect x="1" y="1" width="62" height="62" rx="19" fill="#ffffff12" stroke="#e4c878"/><path d="M40 14c-10 2-17 11-17 21 0 11 8 19 19 19 4 0 8-1 11-3-4 6-11 10-19 10C21 61 11 51 11 39S20 17 31 12c3-1 6-1 9 2Z" fill="#f0d589"/><circle cx="43" cy="20" r="2.3" fill="#f0d589"/></svg></div>
  <div><h1>Israya</h1><p>La foi, le savoir et le bien qui perdure.</p></div>
 </div>
 <div class="greeting">Un pas vers le bien,<br>chaque jour.</div>
 <div class="sub">Apprendre, lire et pratiquer avec des sources clairement indiquées.</div>
</header>

<main id="app"></main>

<nav aria-label="Navigation principale">
<button data-page="home"><span>⌂</span>Accueil</button>
<button data-page="quran"><span>☪</span>Coran</button>
<button data-page="academy"><span>آ</span>Académie</button>
<button data-page="prayer"><span>◷</span>Prières</button>
<button data-page="more"><span>☷</span>Plus</button>
</nav>

<script>
const app=document.getElementById('app');
const saved=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};
const store=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const state={page:'home',dark:saved('israya-dark',false),progress:saved('israya-progress',0),city:saved('israya-city',''),method:saved('israya-method','3'),school:saved('israya-school','0'),favorites:saved('israya-favorites',[])};
document.documentElement.classList.toggle('dark',state.dark);

function tile(icon,title,desc,page){return `<button class="tile" onclick="go(&quot;${page}&quot;)"><span class="emoji">${icon}</span><strong>${title}</strong><small>${desc}</small></button>`}
function go(page){state.page=page;render();window.scrollTo(0,0)}
function layout(title,body,tag=''){return `<div class="section-title"><h2>${title}</h2>${tag?`<span class="pill">${tag}</span>`:''}</div>${body}`}
function fav(key){state.favorites=state.favorites.includes(key)?state.favorites.filter(x=>x!==key):[...state.favorites,key];store('israya-favorites',state.favorites);render()}
function quiz(ok){document.getElementById('quiz-result').textContent=ok?'✓ Bonne réponse. Bā’ (ب) porte un point en dessous.':'Pas tout à fait. Regarde le repère sous ب.'}
function savePrefs(){state.city=document.getElementById('city').value.trim();state.method=document.getElementById('method').value;state.school=document.getElementById('school').value;store('israya-city',state.city);store('israya-method',state.method);store('israya-school',state.school);document.getElementById('prefs-result').textContent='Préférences enregistrées sur cet appareil.'}
function toggleDark(){state.dark=!state.dark;document.documentElement.classList.toggle('dark',state.dark);store('israya-dark',state.dark);render()}
function advance(){state.progress=Math.min(100,state.progress+10);store('israya-progress',state.progress);render()}
function reflectDream(){document.getElementById('dream-result').textContent='Merci. Une lecture prudente peut distinguer les éléments personnels du rêve des références religieuses établies. Israya ne prétendra ni connaître l’invisible ni prédire l’avenir.'}

function locateQibla(){
 if(!navigator.geolocation){document.getElementById('qibla-result').textContent='La géolocalisation n’est pas disponible. Tu peux utiliser une ville manuellement.';return}
 navigator.geolocation.getCurrentPosition(pos=>{
  const lat=pos.coords.latitude, lon=pos.coords.longitude, kaabaLat=21.422487, kaabaLon=39.826206;
  const r=Math.PI/180, y=Math.sin((kaabaLon-lon)*r), x=Math.cos(lat*r)*Math.tan(kaabaLat*r)-Math.sin(lat*r)*Math.cos((kaabaLon-lon)*r);
  let bearing=(Math.atan2(y,x)/r+360)%360;
  document.getElementById('qibla-result').innerHTML=`Position obtenue. Direction théorique de la qibla : <b>${bearing.toFixed(1)}°</b> depuis le nord. <span class="muted">La précision dépend des capteurs du téléphone.</span>`;
 },()=>document.getElementById('qibla-result').textContent='Autorisation refusée ou position indisponible. Saisis une ville pour une prochaine version avec géocodage.')
}

async function loadPrayer(){
 const city=state.city||document.getElementById('city')?.value.trim();
 const method=state.method||'3', school=state.school||'0';
 if(!city){document.getElementById('prayer-result').textContent='Indique d’abord une ville.';return}
 const country=(/maroc/i.test(city))?'Morocco':(/alg/i.test(city))?'Algeria':(/tun/i.test(city))?'Tunisia':(/mecque|makk/i.test(city))?'Saudi Arabia':(/médine|medina/i.test(city))?'Saudi Arabia':'France';
 document.getElementById('prayer-result').textContent='Chargement des horaires…';
 try{
  const date=new Date(), d=String(date.getDate()).padStart(2,'0'), m=String(date.getMonth()+1).padStart(2,'0'), y=date.getFullYear();
  const url=`https://api.aladhan.com/v1/timingsByCity/${d}-${m}-${y}?city=${encodeURIComponent(city)}&country=${encodeURIComponent(country)}&method=${encodeURIComponent(method)}&school=${encodeURIComponent(school)}&iso8601=true`;
  const res=await fetch(url); if(!res.ok) throw new Error();
  const data=await res.json(); const t=data.data.timings;
  const names=[['Fajr','Fajr'],['Dhuhr','Dhuhr'],['Asr','Asr'],['Maghrib','Maghrib'],['Isha','Isha']];
  document.getElementById('prayer-result').textContent=`Horaires calculés pour ${city}. Compare-les avec ta mosquée locale : les réglages peuvent différer.`;
  document.getElementById('prayers').innerHTML=names.map(([k,l])=>`<div class="prayer"><b>${l}</b><time>${t[k]?.slice(0,5)||'—'}</time></div>`).join('');
 }catch(e){document.getElementById('prayer-result').textContent='Impossible de récupérer les horaires actuellement. Aucun horaire fictif n’est affiché.'}
}

const pages={
home:()=>`<div class="daily"><div class="moon">☾</div><div><strong>Un rappel pour aujourd’hui</strong><p>Avance avec constance : une petite action utile peut devenir durable.</p></div></div>
<div class="section-title"><h2>Explorer Israya</h2><span class="hint">9 espaces</span></div>
<div class="grid">${tile('📖','Coran','Lire et suivre sa progression','quran')}${tile('🪴','Académie d’arabe','Apprendre pas à pas','academy')}${tile('🤲','Invocations','Textes et références','duas')}${tile('🧭','Qibla','Calculer la direction','qibla')}${tile('🕌','Horaires de prière','Aujourd’hui, selon ta ville','prayer')}${tile('🌙','Guide de la Omra','Comprendre les rites','umrah')}${tile('✨','Sadaqa jariya','Idées de bien durable','sadaqa')}${tile('💭','Rêves','Réflexion prudente','dreams')}${tile('💬','Assistant islamique','Questions et sources','assistant')}</div>
<div class="panel"><h3>🌿 Ton parcours</h3><p class="muted">Progression locale : ${state.progress} %</p><div class="progress"><i style="width:${state.progress}%"></i></div><div class="btn-row"><button class="btn" onclick="go(&quot;academy&quot;)">Continuer l’académie</button><button class="btn secondary" onclick="go(&quot;settings&quot;)">Réglages</button></div></div>`,
quran:()=>layout('Le Saint Coran',`<div class="panel"><div class="notice">Version de départ : le lecteur complet, les 114 sourates, les traductions et les récitations seront connectés à des sources vérifiées avant publication. Aucun contenu inventé n’est affiché.</div><div class="item"><strong>Al-Fātiḥa · 1:1</strong><div class="arabic">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div><p><em>Bismillāhi r-raḥmāni r-raḥīm</em></p><p class="muted">Référence : Coran, sourate 1, verset 1. Traduction française complète à intégrer avec une licence appropriée.</p></div><div class="item"><strong>Dernière lecture</strong><p class="muted">Aucun historique détaillé n’est encore enregistré.</p></div><div class="btn-row"><button class="btn secondary" onclick="fav(&quot;quran:1:1&quot;)">${state.favorites.includes('quran:1:1')?'★':'☆'} Favori</button><button class="btn" onclick="go(&quot;academy&quot;)">Apprendre à lire</button></div></div>`,'Lecture'),
academy:()=>layout('Académie d’arabe et de lecture','<div class="panel"><div class="notice">Parcours progressif : cette version contient le premier module. Les modules suivants sont structurés pour être ajoutés sans verrouillage payant.</div><h3>Leçon 1 — Sens de lecture et premières lettres</h3><p>On lit l’arabe de droite à gauche. Observe la forme de la lettre et son emplacement dans le mot.</p><div class="item"><div class="arabic">ا</div><strong>Alif</strong><p class="muted">Lettre de l’alphabet arabe. Sa fonction et ses formes seront étudiées avec la hamza et les voyelles longues.</p></div><div class="item"><div class="arabic">ب</div><strong>Bā’ — b</strong><p class="muted">Un point sous la lettre.</p></div><div class="item"><div class="arabic">ت</div><strong>Tā’ — t</strong><p class="muted">Deux points au-dessus.</p></div><h3>Mini-quiz</h3><p>Quelle lettre porte un point en dessous ?</p><div class="btn-row"><button class="btn secondary" onclick="quiz(false)">ت</button><button class="btn secondary" onclick="quiz(true)">ب</button><button class="btn secondary" onclick="quiz(false)">ا</button></div><p id="quiz-result" class="muted" aria-live="polite"></p><div class="btn-row"><button class="btn" onclick="advance()">Valider +10 %</button></div><p class="muted">Suite prévue : lettres en position initiale/médiane/finale, points d’articulation, fatḥa/kasra/ḍamma, madd, hamza, sukūn, shadda, tanwīn, syllabes, mots coraniques, tajwid, exercices et évaluations.</p></div>','Débutant'),
duas:()=>layout('Invocations','<div class="panel"><div class="item"><strong>Formule d’ouverture</strong><div class="arabic">بِسْمِ اللَّهِ</div><p><em>Bismillāh</em></p><p>« Au nom d’Allah. »</p><p class="muted">Formule largement attestée. Les invocations assorties de mérites précis seront publiées avec leur source et leur degré d’authenticité lorsqu’il est établi.</p></div><label>Recherche</label><input placeholder="matin, soir, voyage, patience…"><p class="muted">Catégories et corpus vérifié à connecter dans l’étape suivante.</p></div>','Douas'),
qibla:()=>layout('Direction de la qibla','<div class="panel"><p>La Kaaba est utilisée comme point de référence géographique. Le calcul ci-dessous utilise ta position GPS et un calcul de relèvement géographique.</p><button class="btn" onclick="locateQibla()">Utiliser ma position</button><p id="qibla-result" class="muted" aria-live="polite">Aucune position demandée.</p><div class="notice">Pour une boussole fiable, éloigne-toi des sources magnétiques et calibre le téléphone si nécessaire. Si la localisation est refusée, Israya pourra proposer une saisie de ville.</div></div>','Qibla'),
prayer:()=>layout('Horaires de prière',`<div class="panel"><div class="notice">Les horaires ci-dessous viennent d’un service de calcul lorsqu’il est disponible. Ils peuvent différer de ceux d’une mosquée locale : compare les réglages avant de les utiliser comme référence.</div><label>Ville</label><input id="city" value="${state.city}" placeholder="Ex. Créteil"><label>Méthode</label><select id="method"><option value="3" ${state.method==='3'?'selected':''}>Muslim World League</option><option value="2" ${state.method==='2'?'selected':''}>Islamic Society of North America</option><option value="4" ${state.method==='4'?'selected':''}>Umm al-Qura</option><option value="5" ${state.method==='5'?'selected':''}>Egyptian General Authority</option></select><label>Asr — école</label><select id="school"><option value="0" ${state.school==='0'?'selected':''}>Standard / Shafi</option><option value="1" ${state.school==='1'?'selected':''}>Hanafi</option></select><div class="btn-row"><button class="btn" onclick="savePrefs();loadPrayer()">Enregistrer et calculer</button></div><p id="prayer-result" class="muted"></p><div id="prayers" class="prayer-grid"></div><p class="muted">Source technique prévue pour cette version : API AlAdhan. Les conditions et limites du service doivent être vérifiées avant un déploiement à grande échelle.</p></div>`,'Aujourd’hui'),
umrah:()=>layout('Guide de la Omra','<div class="panel"><div class="item"><strong>1 · Préparation</strong><p>Préparer son voyage, apprendre les rites et vérifier les conditions pratiques applicables à sa situation.</p></div><div class="item"><strong>2 · Ihram</strong><p>Comprendre l’intention, les règles et les interdits de l’état de sacralisation. Certains détails dépendent de la situation et de l’école suivie.</p></div><div class="item"><strong>3 · Tawaf</strong><p>Effectuer les circumambulations autour de la Kaaba conformément aux règles apprises auprès de sources qualifiées.</p></div><div class="item"><strong>4 · Sa’i</strong><p>Parcourir le trajet entre Ṣafā et Marwa selon les rites de la Omra.</p></div><div class="item"><strong>5 · Fin des rites</strong><p>Terminer selon les règles applicables, notamment par le raccourcissement ou le rasage des cheveux selon le cas.</p></div><div class="notice">Guide introductif : les références détaillées et les divergences d’avis seront ajoutées et vérifiées avant publication finale.</div></div>','Guide'),
sadaqa:()=>layout('Sadaqa jariya','<div class="panel"><p>Des idées de bien durable sans pression financière :</p><div class="item">📚 Partager un savoir utile et vérifié.</div><div class="item">💧 Contribuer à un projet d’accès à l’eau après vérification.</div><div class="item">🌱 Aider à un projet environnemental local.</div><div class="item">♿ Rendre des ressources éducatives accessibles.</div><div class="item">🤝 Transmettre une compétence utile à quelqu’un.</div><p class="muted">Israya ne collecte aucun don dans cette version.</p></div>','Bien durable'),
dreams:()=>layout('Interprétation des rêves','<div class="panel"><p>Cette rubrique est distincte de l’assistant islamique. Décris ton rêve pour obtenir une réflexion prudente, jamais une prédiction.</p><textarea id="dream" rows="6" placeholder="Décris ton rêve…"></textarea><button class="btn" onclick="reflectDream()">Réfléchir avec prudence</button><p id="dream-result" class="muted" aria-live="polite"></p><div class="notice">Israya ne prétend pas connaître l’invisible. Une interprétation incertaine ne doit pas être présentée comme une certitude religieuse ni servir seule à prendre une décision importante.</div></div>','Prudence'),
assistant:()=>layout('Assistant islamique IA','<div class="panel"><div class="notice">Le moteur IA n’est pas activé dans cette version. C’est volontaire : Israya ne doit pas inventer des versets, hadiths ou avis. La prochaine étape consiste à brancher un moteur avec recherche documentaire et citations vérifiables.</div><label>Ta question</label><textarea rows="5" placeholder="Ex. Quelle est la différence entre…"></textarea><button class="btn secondary" disabled>Poser la question — en développement</button><p class="muted">Principe de réponse prévu : source primaire → référence exacte → degré d’authenticité → divergence éventuelle → limites → orientation vers un savant qualifié pour les cas complexes.</p></div>','IA'),
settings:()=>layout('Réglages','<div class="panel"><h3>Apparence</h3><button class="btn secondary" onclick="toggleDark()">'+(state.dark?'☀️ Mode clair':'🌙 Mode sombre')+'</button><h3 style="margin-top:18px">Confidentialité</h3><p class="muted">Les favoris et la progression de cette version sont stockés localement dans le navigateur. Aucun compte n’est requis.</p><h3>Langue</h3><select><option>Français — interface actuelle</option><option>Arabe — prévu</option><option>English — prévu</option><option>Darija algérienne — prévu</option><option>Darija tunisienne — prévu</option><option>Darija marocaine — prévu</option></select><p class="muted">Les autres langues seront activées uniquement après traduction et vérification des menus et contenus.</p></div>','Paramètres'),
more:()=>layout('Toutes les rubriques','<div class="grid">'+tile('💬','Assistant islamique','Sources et questions','assistant')+tile('📖','Coran','Lecture et progression','quran')+tile('🪴','Académie','Arabe, lecture, tajwid','academy')+tile('🤲','Invocations','Douas référencées','duas')+tile('🧭','Qibla','Direction de La Mecque','qibla')+tile('🕌','Prières','Horaires et méthode','prayer')+tile('🌙','Omra','Guide progressif','umrah')+tile('✨','Sadaqa jariya','Bien durable','sadaqa')+tile('💭','Rêves','Réflexion prudente','dreams')+tile('⚙️','Réglages','Langue, confidentialité','settings')+'</div>','Rubriques')
};

function render(){
 app.innerHTML=(pages[state.page]||pages.home)()+`<footer>Israya · version de travail · aucun abonnement · aucune fonction essentielle payante.</footer>`;
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page));
 if(state.page==='prayer' && state.city) setTimeout(loadPrayer,50);
}
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));
if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
render();
</script>
</body>
</html>
